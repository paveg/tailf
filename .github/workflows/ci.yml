name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      # TODO: Enable typecheck once existing TS errors are fixed
      # (tsc --build fails due to tsconfig project references + noEmit conflict)
      # - name: Type check
      #   run: pnpm typecheck

      - name: Check migrations are in sync with schema
        run: |
          # drizzle-kit exits 0 even when it cannot resolve a rename prompt without a TTY,
          # so success is decided by its own "No schema changes" message and a clean tree.
          pnpm --filter @tailf/api exec drizzle-kit generate < /dev/null 2>&1 | tee "$RUNNER_TEMP/generate.log"
          if ! grep -q "No schema changes" "$RUNNER_TEMP/generate.log" || [ -n "$(git status --porcelain apps/api/migrations)" ]; then
            echo "::error::schema.ts and apps/api/migrations are out of sync. Run pnpm db:generate and commit the result."
            git status --short apps/api/migrations
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Placeholder URL is unreachable; opt out of strict SSG fetch so the
          # build verifies pipeline syntax without needing real data.
          PUBLIC_API_URL: https://example.com/api
          SSG_ALLOW_EMPTY: 'true'
